name: Checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test,lint,release,io]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - name: Fast tests
        if: hashFiles('tests/**/test_*.py') != ''
        run: python -m pytest -m "not slow and not reference"
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install wheel outside the source environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/pyfcirt-wheel"
          if [ "$RUNNER_OS" = "Windows" ]; then
            PYTHON="$RUNNER_TEMP/pyfcirt-wheel/Scripts/python.exe"
          else
            PYTHON="$RUNNER_TEMP/pyfcirt-wheel/bin/python"
          fi
          "$PYTHON" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$PYTHON" -c "import pyfcirt; from importlib.resources import files; assert files('pyfcirt').joinpath('py.typed').is_file(); print(pyfcirt.__version__)"
